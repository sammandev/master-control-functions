<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the persisted (or system) theme before first paint to
			// avoid a light-theme flash on dark loads (ticket 01).
			(() => {
				try {
					const stored = localStorage.getItem('theme');
					if (
						stored === 'dark' ||
						(!stored && matchMedia('(prefers-color-scheme: dark)').matches)
					) {
						document.documentElement.classList.add('dark');
					}
				} catch {
					// localStorage can be blocked (privacy mode); keep the light default.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

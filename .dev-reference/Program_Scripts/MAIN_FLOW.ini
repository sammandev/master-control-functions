Telnet_Passwd  	= "TELNET|SENDSTR_AND_WAITSTR|SAVE_DATA@*V:DUT_LOGIN_SETTING-PASSWORD#|*V:DUT_LOGIN_SETTING-CLI_PROMPT#|5000|Telnet_Check|FAIL"
Telnet_Check    = "TELNET|SENDSTR_AND_WAITSTR|SAVE_DATA@*V:DUT_LOGIN_SETTING-SHELL_CMD#|*V:DUT_LOGIN_SETTING-SHELL_PROMPT#|5000|Change_PATH|FAIL"

Change_PATH			= "TELNET|SENDSTR_AND_WAITSTR|SAVE_DATA@cd /tmp/HH5K|#|5000|Set_Export|FAIL
Set_Export#Retry:1	= "TELNET|SENDSTR_AND_WAITSTR|SAVE_DATA@export PATH=$PATH:/tmp/HH5K|#|5000|SAVE_6G_PA|FAIL" 

SAVE_6G_PA#Retry:2	= "TELNET|SENDSTR_AND_WAITSTR|SAVE_DATA@./pega_write_pavars_nvram_6g.sh -i wl2 -v|done|10000|Delay_QUIT|FAIL"
Delay_QUIT			= "Test Program|Delay|500|NULL|5000|QUIT|FAIL"

[SAVE_6G_RSSI_CAL#ErrCode:SAVE_PARAMETER]
SAVE_6G_RSSI_CAL#Retry:2 = "TELNET|SENDSTR_AND_WAITSTR|SAVE_DATA@./pega_write_rssi_nvram_6g.sh -i wl2 -v|DONE|5000|Delay_QUIT|FAIL"
Delay_QUIT       = "Test Program|Delay|500|NULL|5000|QUIT|FAIL" 

[SAVE_NVRAM_FILE#ErrCode:SAVE_PARAMETER]
SAVE_NVRAM_FILE#Retry:2	 = "TELNET|SENDSTR_AND_WAITSTR|SAVE_DATA@scos-wifi freezenvram|has been frozen|5000|Delay_QUIT|FAIL"
Delay_QUIT		 = "Test Program|Delay|500|NULL|5000|QUIT|FAIL"

[SAVE_PREDICTION_STATE#ErrCode:Other in program error.]
SAVE_LAST_STATE				= "DLLWIFI_TEST|SAVE_STATE|NULL|NULL|5000|QUIT|DELAY_FAIL_QUIT"
DELAY_FAIL_QUIT           	= "Test Program|Delay|500|NULL|10000|QUIT|FAIL"

;//NVRAM CHECK

[NVRAM_MD5_Check#ErrCode:DUT_NVRAM_MD5_Check_Fail]
Get_NVRAM#Retry:2 = "TELNET|SENDSTR_AND_RECV_ONE_REG|SAVE_DATA@md5sum /opt/conf/.kernel_nvram.setting_CA,setting_CA+\s*(?<Value>[\w\d]{32})|NVRAM_MD5_AFTER_TEST|10000|Delay_Compare|FAIL"
Delay_Compare     = "Test Program|Delay|500|NULL|20000|Compare_NVRAM|FAIL"
Compare_NVRAM     = "TEST PROGRAM|LABEL_COMPARE|NVRAM_FILE_MD5,*V:Label-NVRAM_MD5_BEFORE_TEST#|Calibrated MD5,*V:Label-NVRAM_MD5_AFTER_TEST#|5000|NVRAM_FAIL|NVRAM_PASS"
NVRAM_PASS        = "Test Program|Delay|500|NULL|20000|QUIT|FAIL"
NVRAM_FAIL        = "Test Program|LABEL_COMPARE|PASS,0|FAIL,-1|NULL|Delay_QUIT|FAIL"
Delay_QUIT        = "Test Program|Delay|500|NULL|20000|QUIT|FAIL"

[Set_DUT_XGSPON#ErrCode:Telnet command Fail!,Retry:2]
Set_DUT_to_XGSPON#Retry2	= "TELNET|SENDSTR_AND_WAITSTR|SAVE_DATA@fw_setenv pon_type XGS|#|5000|Delay|FAIL"
Delay						= "Test Program|Delay|100|NULL|5000|Check_PON_Type|FAIL"
Check_PON_Type				= "TELNET|SENDSTR_AND_WAITSTR|SAVE_DATA@fw_setenv pon_type XGS|XGS|5000|DUT_XGSPON_DONE|FAIL"
DUT_XGSPON_DONE				= "Test Program|Delay|100|NULL|5000|QUIT|FAIL"

[DUT_REMOVE#ErrCode:DUT_REMOVE]
Delay_REMOVE    = "Test Program|Delay|100|NULL|5000|DUT_REMOVE_IOT|FAIL"
DUT_REMOVE_IOT  = "DLLIOT|DUT_REMOVE|NULL|NULL|5000|DUT_REMOVE|DUT_REMOVE"
DUT_REMOVE      = "DLLWIFI_TEST|DUT_REMOVE|NULL|NULL|5000|QUIT|Delay_QUIT"
Delay_QUIT      = "Test Program|Delay|100|NULL|5000|QUIT|FAIL"

[IQ_DISCONNECTION#ErrCode:IQ_DISCONNECTION]
IQ_DISCONNECTION#Retry:2 = "DLLWIFI_TEST|TESTER_DISCONNECTION|NULL|NULL|10000|QUIT|FAIL"

[FTP_CopyFile#ErrCode:DUT_Ping_FTP_Server_Fail]
Copy_TestResult 	= "FTP|COPY_TEST_RESULTS_ALLCSV|*V:SELECTED STATION-NAME#\*V:Script_Info-Ver#,*V:TestInfo-FTP_Enable#|NULL|5000|QUIT|Force_PASS_Test"
; Copy_TestResult    = "FTP|COPY_TEST_RESULTS|*V:Script_Info-Ver#,*V:TestInfo-FTP_Enable#|NULL|15000|QUIT|FAIL"
Force_PASS_Test 	= "Test Program|LABEL_COMPARE|PASS,1|Force,1|NULL|QUIT|FAIL"

[AUTO_RUN#ErrCode:Other in program error.]
PingOFF1#Retry:30	= "Test Program|CMD_PING|ping -S *V:Setting-SRCNIC_IP# *V:Setting-DUT_IP# -n 3 -w 100|FALSE|100000|DelayNext|PingOFF2"
PingOFF2#Retry:30	= "Test Program|CMD_PING|ping -S *V:Setting-SRCNIC_IP# *V:Setting-DUT_IP# -n 3 -w 100|FALSE|100000|DelayNext|Confirm_DUT_OUT"

Confirm_DUT_OUT		= "Test Program|Confirm_DIALOG|Tolong Keluarkan Board dari Shielding Box!|NULL|200000|PingOFF3|PingOFF3"
PingOFF3#Retry:5	= "Test Program|CMD_PING|ping -S *V:Setting-SRCNIC_IP# *V:Setting-DUT_IP# -n 3 -w 100|FALSE|100000|DelayNext|Stop"

DelayNext			= "Test Program|Delay|500|NULL|10000|Change_Result_Pic|FAIL"
Change_Result_Pic	= "TEST PROGRAM|CHANGE_RESULT_PIC|READY|NULL|10000|PING_DUT_ON1|FAIL"

PING_DUT_ON1#Retry:30 = "TEST PROGRAM|CMD_PING|ping *V:Setting-DUT_IP# -S *V:Setting-SRCNIC_IP# -n 2 -w 10|PassN=2&Connect=TRUE|20000|Delay_RUN|PING_DUT_ON2"
PING_DUT_ON2#Retry:30 = "TEST PROGRAM|CMD_PING|ping *V:Setting-DUT_IP# -S *V:Setting-SRCNIC_IP# -n 2 -w 10|PassN=2&Connect=TRUE|20000|Delay_RUN|Stop"
Delay_RUN            = "Test Program|Delay|500|NULL|10000|Run|Stop"
Run                  = "Test Program|AUTO_RUN|TRUE|NULL|NULL|QUIT|FAIL"
Stop                 = "Test Program|AUTO_RUN|FALSE|NULL|NULL|QUIT|FAIL"

